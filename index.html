<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="manifest" href="manifest.json">
<meta name="app-version" content="1.0.4">
<meta name="theme-color" content="#38bdf8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrite Calculator</title>

<style>
.option-note {
    font-size: 12px;
    color: #94a3b8;
    line-height: 1.3;

    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.25s ease, max-height 0.25s ease;
}

.option-note.active {
    opacity: 0.85;
    max-height: 80px;
}

.option-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.option-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
}

.option-input {
    width: fit-content;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.25s ease, max-height 0.25s ease;
}

.option-input.active {
    opacity: 1;
    max-height: 80px;
}


/* Ô nhập gọn cho Monthly / Podcast */
.compact-input {
    width: 120px;
    max-width: 100%;
}

/* Select gọn */
.compact-select {
    width: 100px;
    max-width: 100%;
}

/* Tạo khoảng thở giữa 2 cột */
.row-2 > div {
    padding-right: 6px;
}

.label-inline {
    display: flex;
    align-items: center;
    gap: 3px;
}

.icon-img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    vertical-align: middle;
    margin-right: 6px;
}

/* ===== Required input - clean UI ===== */
.required-input {
    border: 1.5px solid #475569;      /* xám trung tính */
    background: #020617;
    color: #e5e7eb;
    border-radius: 8px;
    padding: 10px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

/* Chưa nhập / = 0 */
.required-input.is-empty {
    border-color: #f59e0b;             /* cam nhạt */
}

/* Đang focus */
.required-input:focus {
    outline: none;
    border-color: #38bdf8;             /* xanh dương nhạt */
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
}

/* Hợp lệ */
.required-input.is-valid {
    border-color: #22c55e;             /* xanh lá nhạt */
}

/* Lỗi */
.required-input.is-error {
    border-color: #ef4444;             /* đỏ nhạt */
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.12);
}

/* Nhãn bắt buộc */
.required-label::after {
    content: " *";
    color: #f97316;
    font-weight: bold;
}

/* ===== Hàng 2 cột linh hoạt ===== */
.row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* ===== Hàng nút ===== */
.row-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

/* ===== Mobile: vẫn giữ 2 cột nhưng gọn ===== */
@media (max-width: 480px) {
    .row-2,
    .row-buttons {
        gap: 8px;
    }
}

/* ===== Layout chung ===== */
.container {
    max-width: 720px;
    margin: auto;
    padding: 12px;
}

/* ===== Input group ===== */
.input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
}

/* ===== Event grid ===== */
#eventInputs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-top: 8px;
}

/* Event item */
.event-item {
    background: #0f172a;
    border-radius: 8px;
    padding: 6px;
}

.event-item label {
    font-size: 13px;
    color: #e5e7eb;
}

.event-item input {
    width: 100%;
}

/* ===== Buttons ===== */
button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
}

/* ===== Result ===== */
#result {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    background: #020617;
}

/* ===== Mobile tối ưu ===== */
@media (max-width: 480px) {
    #eventInputs {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    padding: 15px;
}
h1 {
    color: #38bdf8;
    text-align: center;
}
.box, .result {
    background: #020617;
    padding: 15px;
    border-radius: 12px;
    max-width: 600px;
    margin: 15px auto;
}
label {
    display: block;
    margin-top: 10px;
}
input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
}
input[type="checkbox"] {
    width: auto;
    transform: scale(1.2);
    margin-right: 5px;
}
button {
    background: #38bdf8;
    color: #000;
    font-weight: bold;
    margin-top: 15px;
}
button:hover {
    background: #0ea5e9;
}
.total {
    color: #22c55e;
    font-size: 20px;
    font-weight: bold;
}
.error {
    border: 2px solid #ef4444;
}
.error-text {
    color: #ef4444;
    margin-top: 10px;
}
ul {
    margin-left: 20px;
}
.small {
    font-size: 13px;
    color: #94a3b8;
}
</style>
</head>

<body>
<div class="container">
<div class="box">
	
	<div class="row-2">
	
		<!-- Thẻ Tháng -->
		<div class="option-box">
		
		<!-- Tiêu đề -->
		<label class="option-title">
			<input type="checkbox" id="monthly"
				onchange="toggleMonthly(); saveCheckboxState()">
			<img src="assets/icons/monthly.png" class="icon-img" alt="">
			Thẻ Tháng
		</label>
		
		<!-- Input -->
		<div id="monthlyBox" class="option-input">
			<input type="number"
				id="monthlyDays"
				class="compact-input"
				value="30"
				min="1"
				max="180"
				oninput="saveLastInputDebounced()">
		</div>
		
		<!-- Ghi chú -->
		<div class="option-note" id="monthlyNote">
			(Mỗi thẻ = 30 ngày · Có thể cộng dồn tối đa 180 ngày)
		</div>
		
		</div>
		
		<!-- Podcast -->
		<div class="option-box">
		
		<!-- Tiêu đề -->
		<label class="option-title">
			<input type="checkbox" id="podcast"
				onchange="togglePodcast(); saveCheckboxState()">
			<img src="assets/icons/podcast.png" class="icon-img" alt="">
			Podcast
		</label>
		
		<!-- Select -->
		<div id="podcastBox" class="option-input">
			<select id="podcastCount"
					class="compact-select"
					onchange="saveLastInputDebounced()">
			<option value="1">1</option>
			<option value="2">2</option>
			</select>
		</div>
		
		<!-- Ghi chú -->
		<div class="option-note" id="podcastNote">
			(Mỗi Podcast = 1480 Astrite · Phụ thuộc bản update game)
		</div>
		
		</div>
	
	</div>

	<label>Số lượng Event:
		<select id="eventCount" onchange="renderEventInputs(); saveLastInputDebounced()">
			<option value="0">0</option>
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
			<option value="5">5</option>
			<option value="6">6</option>
			<option value="7">7</option>
			<option value="8">8</option>
			<option value="9">9</option>
			<option value="10">10</option>
		</select>
	</label>

<div id="eventInputs"></div>

	<div class="row-2">
	
	<!-- Thuyền -->
	<div class="option-box">
	
		<!-- Tiêu đề -->
		<label class="option-title">
		<input type="checkbox" id="enableShip"
				onchange="toggleShip(); saveCheckboxState()">
		<img src="assets/icons/ship.png" class="icon-img" alt="">
		Thuyền
		</label>
	
		<!-- Input -->
		<div id="shipBox" class="option-input">
		<input type="number"
				id="shipStart"
				class="compact-input"
				value="0"
				min="1"
				oninput="saveLastInputDebounced()">
		</div>
	
		<!-- Ghi chú -->
		<div class="option-note" id="shipNote">
		(Ngày làm mới Thuyền, chu kỳ 28 ngày)
		</div>
	
	</div>
	
	<!-- Tháp -->
	<div class="option-box">
	
		<!-- Tiêu đề -->
		<label class="option-title">
		<input type="checkbox" id="enableTower"
				onchange="toggleTower(); saveCheckboxState()">
		<img src="assets/icons/tower.png" class="icon-img" alt="">
		Tháp
		</label>
	
		<!-- Input -->
		<div id="towerBox" class="option-input">
		<input type="number"
				id="towerStart"
				class="compact-input"
				value="0"
				min="1"
				oninput="saveLastInputDebounced()">
		</div>
	
		<!-- Ghi chú -->
		<div class="option-note" id="towerNote">
		(Ngày làm mới Tháp, chu kỳ 28 ngày)
		</div>
	
	</div>
	
	</div>

	<label class="required-label">
		Số Ngày Mục Tiêu
		<input type="number"
			id="days"
			class="required-input"
			value="0"
			min="1"
			oninput="saveLastInputDebounced(); updateDaysHighlight()">
	</label>

    <button onclick="calculate()"><img src="assets/icons/event.png" class="icon-img" alt="">TÍNH ASTRITE <img src="assets/icons/event.png" class="icon-img" alt=""></button>
	
	<div class="row-buttons">
		<button onclick="clearCurrentInput()"
				style="margin-top:8px;background:#334155;color:#fff;">
			♻️ Xóa dữ liệu nhập hiện tại
		</button>
	
		<button onclick="clearAllInput()"
				style="margin-top:8px;background:#000;color:#fff;">
			❌ Xóa tất cả (Reset toàn bộ dữ liệu nhập)
		</button>
	</div>

    <label class="small">Lịch sử 30 lần gần nhất:</label>
    <select id="history" onchange="loadHistory()">
        <option value="">-- Chọn lịch sử --</option>
    </select>
	
	<div class="row-buttons">
		<button onclick="deleteSelectedHistory()"
				style="margin-top:8px;background:#ef4444;color:#fff;">
			🗑 Xóa lịch sử đang chọn
		</button>
		
		<button onclick="deleteAllHistory()"
				style="margin-top:5px;background:#7f1d1d;color:#fff;">
			❌ Xóa toàn bộ lịch sử
		</button>
	</div>
</div>

<p id="app-version"
   style="text-align:center;font-size:13px;color:#94a3b8;margin-top:10px;">
</p>

<div class="result" id="result"></div>

<script>
const CYCLE = 28;
const STORAGE_KEY = "astrite_history";
const CHECKBOX_STATE_KEY = "astrite_checkbox_state";
const LAST_INPUT_KEY = "astrite_last_input";
let saveInputTimer = null;

function addDays(date, days) {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
}
function formatDate(d) {
    return d.toLocaleDateString("vi-VN");
}

function validate(days, ship, tower) {
    if (days <= 0) return "Số Ngày Mục Tiêu phải lớn hơn 0";
    if (ship !== 0 && ship < 0) return "Ngày làm mới Thuyền không được âm";
    if (tower !== 0 && tower < 0) return "Ngày làm mới Tháp không được âm";
    return "";
}

function toggleShip() {
    const checked = document.getElementById("enableShip").checked;
    const box = document.getElementById("shipBox");
    const input = document.getElementById("shipStart");
    const note = document.getElementById("shipNote");

    if (checked) {
        box.style.display = "block";
        note.style.display = "block";
    } else {
        box.style.display = "none";
        note.style.display = "none";
        input.value = 0;
    }
}

function toggleTower() {
    const checked = document.getElementById("enableTower").checked;
    const box = document.getElementById("towerBox");
    const input = document.getElementById("towerStart");
    const note = document.getElementById("towerNote");

    if (checked) {
        box.style.display = "block";
        note.style.display = "block";
    } else {
        box.style.display = "none";
        note.style.display = "none";
        input.value = 0;
    }
}

function saveCheckboxState() {
    const state = {
        monthly: document.getElementById("monthly").checked,
        podcast: document.getElementById("podcast").checked,
        enableShip: document.getElementById("enableShip").checked,
        enableTower: document.getElementById("enableTower").checked
    };
    localStorage.setItem(CHECKBOX_STATE_KEY, JSON.stringify(state));
}

function loadCheckboxState() {
    const saved = localStorage.getItem(CHECKBOX_STATE_KEY);

    let state = {
        monthly: false,
        podcast: false,
        enableShip: false,
        enableTower: false
    };

    if (saved) {
        state = { ...state, ...JSON.parse(saved) };
    }

    document.getElementById("podcast").checked = state.podcast;
	togglePodcast();

    document.getElementById("enableShip").checked = state.enableShip;
    toggleShip();

    document.getElementById("enableTower").checked = state.enableTower;
    toggleTower();
	
	document.getElementById("monthly").checked = state.monthly;
	toggleMonthly();
}

function calculate() {
    const days = +document.getElementById("days").value;
    const enableShip = document.getElementById("enableShip").checked;
	const enableTower = document.getElementById("enableTower").checked;

	const shipStart = enableShip
    ? +document.getElementById("shipStart").value
    : 0;

	const towerStart = enableTower
    ? +document.getElementById("towerStart").value
    : 0;
	
	let eventAstrite = 0;
	document.querySelectorAll(".eventValue").forEach(input => {
		eventAstrite += +input.value || 0;
	});
    const monthly = document.getElementById("monthly").checked;
    const podcast = document.getElementById("podcast").checked;

    console.group("🧮 Astrite Debug");
    console.log({ days, shipStart, towerStart, eventAstrite, monthly, podcast });

	const daysInput = document.getElementById("days");
	daysInput.classList.remove("is-error");
	
	if (days <= 0) {
		daysInput.classList.add("is-error");
		daysInput.focus();
		alert("Vui lòng nhập Số Ngày Mục Tiêu");
		return;
	}
	
    const error = validate(days, shipStart, towerStart);
    if (error) {
        document.getElementById("result").innerHTML =
            `<p class="error-text">❌ ${error}</p>`;
        console.warn(error);
        console.groupEnd();
        return;
    }

    const DAILY = 60, WEEKLY = 160, MONTHLY = 90;
    const PODCAST = 1480, SHIP = 800, TOWER = 800;

    const today = new Date();

    const daily = days * DAILY;
    const weekly = Math.floor(days / 7) * WEEKLY;
	
	let monthlyAstrite = 0;
	
	if (monthly) {
		const monthlyDays = Math.min(
			+document.getElementById("monthlyDays").value || 0,
			180
		);
		monthlyAstrite = Math.min(days, monthlyDays) * 90;
	}

	let podcastAstrite = 0;
	
	if (podcast) {
		const podcastCount = +document.getElementById("podcastCount").value || 1;
		podcastAstrite = podcastCount * PODCAST;
	}

    let shipDates = [];
    for (let d = shipStart; d <= days && d > 0; d += CYCLE) {
        shipDates.push(formatDate(addDays(today, d)));
    }

    let towerDates = [];
    for (let d = towerStart; d <= days && d > 0; d += CYCLE) {
        towerDates.push(formatDate(addDays(today, d)));
    }

    const shipAstrite = shipDates.length * SHIP;
    const towerAstrite = towerDates.length * TOWER;

	/* ===== 1 Tính Toán ===== */
    const total =
        daily + weekly + monthlyAstrite +
        podcastAstrite + eventAstrite +
        shipAstrite + towerAstrite;

    console.log("TOTAL:", total);
    console.groupEnd();
	/* ===== 2 HIỂN THỊ KẾT QUẢ của Hiện Tại ===== */
	const output = `
		<p>
		<img src="assets/icons/daily.png" class="icon-img" alt="">
		Hằng Ngày: ${daily}
		</p>
	
		<p>
		<img src="assets/icons/weekly.png" class="icon-img" alt="">
		Hằng Tuần: ${weekly}
		</p>
	
		<p>
		<img src="assets/icons/monthly.png" class="icon-img" alt="">
		Thẻ Tháng: ${monthlyAstrite}
		</p>
	
		<p>
		<img src="assets/icons/podcast.png" class="icon-img" alt="">
		Podcast: ${podcastAstrite}
		</p>
	
		<p>
		<img src="assets/icons/event.png" class="icon-img" alt="">
		Event Astrite: ${eventAstrite}
		</p>
	
		<p>
		<img src="assets/icons/ship.png" class="icon-img" alt="">
		Thuyền (${shipDates.length} lần): ${shipAstrite}
		</p>
		<ul>${shipDates.map(d => `<li>${d}</li>`).join("")}</ul>
	
		<p>
		<img src="assets/icons/tower.png" class="icon-img" alt="">
		Tháp (${towerDates.length} lần): ${towerAstrite}
		</p>
		<ul>${towerDates.map(d => `<li>${d}</li>`).join("")}</ul>
	
		<hr>
		<p class="total">TỔNG ASTRITE: ${total}</p>
	`;
	/* ===== 3 Render ra màn hình ===== */
    document.getElementById("result").innerHTML = output;

    saveHistory({
    daily,
    weekly,
    monthlyAstrite,
    podcastAstrite,
    eventAstrite,
    shipAstrite,
    towerAstrite,
    shipDates,
    towerDates,
    total
	});
}

function saveHistory(resultData) {
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    history.unshift({
        time: new Date().toLocaleString("vi-VN"),

		input: {
			days: +document.getElementById("days").value,
		
			eventCount: +document.getElementById("eventCount").value,
			eventValues: Array.from(document.querySelectorAll(".eventValue"))
				.map(i => +i.value || 0),
		
			monthly: document.getElementById("monthly").checked,
			podcast: document.getElementById("podcast").checked,
		
			enableShip: document.getElementById("enableShip").checked,
			shipStart: +document.getElementById("shipStart").value,
		
			enableTower: document.getElementById("enableTower").checked,
			towerStart: +document.getElementById("towerStart").value,
			podcastCount: document.getElementById("podcastCount").value || 1,
		},

        result: resultData
    });

    history = history.slice(0, 30);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    loadHistoryList();
}

function loadHistoryList() {
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const select = document.getElementById("history");
    select.innerHTML = '<option value="">-- Chọn lịch sử --</option>';
    history.forEach((h, i) => {
        select.innerHTML += `<option value="${i}">${h.time}</option>`;
    });
}

function loadHistory() {
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const index = document.getElementById("history").value;
    if (index === "") return;

    const h = history[index];

    /* ===== NẠP LẠI INPUT ===== */
    document.getElementById("days").value = h.input.days;
	updateDaysHighlight();
	document.getElementById("eventCount").value = h.input.eventCount || 0;
	renderEventInputs();
	
	if (Array.isArray(h.input.eventValues)) {
		document.querySelectorAll(".eventValue").forEach((input, i) => {
			input.value = h.input.eventValues[i] ?? 0;
		});
	}

    document.getElementById("monthly").checked = h.input.monthly;
    document.getElementById("podcast").checked = h.input.podcast;
	togglePodcast();

	if (h.input.podcastCount !== undefined) {
		document.getElementById("podcastCount").value = h.input.podcastCount;
	}

    document.getElementById("enableShip").checked = h.input.enableShip;
    document.getElementById("shipStart").value = h.input.shipStart;
    toggleShip();

    document.getElementById("enableTower").checked = h.input.enableTower;
    document.getElementById("towerStart").value = h.input.towerStart;
    toggleTower();

    saveCheckboxState();

    /* ===== 1 HIỂN THỊ KẾT QUẢ của Lịch Sử ===== */
    const output = `
        <p><b>🕒 Thời gian:</b> ${h.time}</p>

        <p>
		<img src="assets/icons/daily.png" class="icon-img" alt="">
		Hằng Ngày: ${h.result.daily}
		</p>
        <p>
		<img src="assets/icons/weekly.png" class="icon-img" alt="">
		Hằng Tuần: ${h.result.weekly}</p>
        <p>
		<img src="assets/icons/monthly.png" class="icon-img" alt="">
		Thẻ Tháng: ${h.result.monthlyAstrite}
		</p>
        <p>
		<img src="assets/icons/podcast.png" class="icon-img" alt="">
		Podcast: ${h.result.podcastAstrite}
		</p>
        <p>
		<img src="assets/icons/event.png" class="icon-img" alt="">
		Event: ${h.result.eventAstrite}
		</p>

        <p>
		<img src="assets/icons/ship.png" class="icon-img" alt="">
		Thuyền (${h.result.shipDates.length} lần): ${h.result.shipAstrite}
		</p>
        <ul>${h.result.shipDates.map(d => `<li>${d}</li>`).join("")}</ul>

        <p>
		<img src="assets/icons/tower.png" class="icon-img" alt="">
		Tháp (${h.result.towerDates.length} lần): ${h.result.towerAstrite}
		</p>
        <ul>${h.result.towerDates.map(d => `<li>${d}</li>`).join("")}</ul>

        <hr>
        <p class="total">TỔNG ASTRITE: ${h.result.total}</p>
    `;
	/* ===== 2 Render ra màn hình ===== */
    document.getElementById("result").innerHTML = output;
}

function deleteSelectedHistory() {
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const select = document.getElementById("history");
    const index = select.value;

    if (index === "") {
        alert("Vui lòng chọn một lịch sử để xóa");
        return;
    }

    if (!confirm("Bạn có chắc muốn xóa lịch sử này không?")) return;

    history.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

    select.value = "";
    document.getElementById("result").innerHTML = "";

    loadHistoryList();
}

function deleteAllHistory() {
    if (!confirm("⚠️ Xóa toàn bộ lịch sử? Hành động này không thể hoàn tác!")) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    document.getElementById("history").innerHTML =
        '<option value="">-- Chọn lịch sử --</option>';

    document.getElementById("result").innerHTML = "";
}

function saveLastInput() {
    const eventValues = [];
    document.querySelectorAll(".eventValue").forEach(input => {
        eventValues.push(+input.value || 0);
    });

    const data = {
        days: document.getElementById("days").value,
        eventCount: document.getElementById("eventCount").value,
        eventValues,
        shipStart: document.getElementById("shipStart").value,
        towerStart: document.getElementById("towerStart").value,
		monthlyDays: document.getElementById("monthlyDays")?.value || 0,
		podcastCount: document.getElementById("podcastCount")?.value || 1
    };

    localStorage.setItem(LAST_INPUT_KEY, JSON.stringify(data));
}

function loadLastInput() {
    const saved = localStorage.getItem(LAST_INPUT_KEY);
    if (!saved) return;

    const data = JSON.parse(saved);

    if (data.days !== undefined)
        document.getElementById("days").value = data.days;

    if (data.eventCount !== undefined) {
        document.getElementById("eventCount").value = data.eventCount;
        renderEventInputs();

        if (Array.isArray(data.eventValues)) {
            document.querySelectorAll(".eventValue").forEach((input, i) => {
                input.value = data.eventValues[i] ?? 0;
            });
        }
    }

    if (data.shipStart !== undefined)
        document.getElementById("shipStart").value = data.shipStart;

    if (data.towerStart !== undefined)
        document.getElementById("towerStart").value = data.towerStart;
		
	if (data.monthlyDays !== undefined) {
    document.getElementById("monthlyDays").value = data.monthlyDays;
	}
	
	if (data.podcastCount !== undefined) {
    document.getElementById("podcastCount").value = data.podcastCount;
	}
}

function clearCurrentInput() {
    if (!confirm("Xóa toàn bộ dữ liệu nhập?")) return;

    document.getElementById("days").value = 0;

    if (document.getElementById("enableShip").checked) {
        document.getElementById("shipStart").value = 0;
    }

    if (document.getElementById("enableTower").checked) {
        document.getElementById("towerStart").value = 0;
    }

    document.querySelectorAll(".eventValue").forEach(input => {
        input.value = 0;
    });

    saveLastInput();
}

function clearAllInput() {
    if (!confirm("⚠️ Xóa TẤT CẢ dữ liệu nhập và checkbox?\nLịch sử sẽ được GIỮ LẠI.")) {
        return;
    }

    // Reset input
    document.getElementById("days").value = 0;
    document.getElementById("eventCount").value = 0;
    renderEventInputs();

    document.getElementById("shipStart").value = 0;
    document.getElementById("towerStart").value = 0;

    // Reset checkbox
    document.getElementById("monthly").checked = false;
    toggleMonthly(); // ✅ DÒNG QUAN TRỌNG

    document.getElementById("podcast").checked = false;
	togglePodcast();

    document.getElementById("enableShip").checked = false;
    document.getElementById("enableTower").checked = false;

    toggleShip();
    toggleTower();

    // Xóa state lưu gần nhất (KHÔNG ĐỤNG LỊCH SỬ)
    localStorage.removeItem(LAST_INPUT_KEY);
    localStorage.removeItem(CHECKBOX_STATE_KEY);

    // UI
    document.getElementById("result").innerHTML = "";

    console.warn("🧹 Cleared all input & checkbox (history kept)");
}

function updateDaysHighlight() {
    const input = document.getElementById("days");
    const value = +input.value;

    input.classList.remove("is-empty", "is-valid", "is-error");

    if (value <= 0) {
        input.classList.add("is-empty");
    } else {
        input.classList.add("is-valid");
    }
}

function saveLastInputDebounced() {
    if (saveInputTimer) {
        clearTimeout(saveInputTimer);
    }

    saveInputTimer = setTimeout(() => {
        saveLastInput();
        console.log("💾 Saved last input (debounced)");
    }, 300);
}

function renderEventInputs() {
    const count = +document.getElementById("eventCount").value;
    const container = document.getElementById("eventInputs");

    container.innerHTML = "";

    for (let i = 1; i <= count; i++) {
        const div = document.createElement("div");
        div.className = "event-item";
		div.innerHTML = `
            <label>
                Event ${i} (Astrite):
                <input type="number"
                       class="eventValue"
                       data-index="${i}"
                       value="0"
                       oninput="saveLastInputDebounced()">
            </label>
        `;
        container.appendChild(div);
    }
}

function toggleMonthly() {
    const checked = document.getElementById("monthly").checked;
    const box = document.getElementById("monthlyBox");
    const note = document.getElementById("monthlyNote");
    const input = document.getElementById("monthlyDays");

    if (checked) {
        box.classList.add("active");
        note.classList.add("active");
        if (!input.value || +input.value <= 0) input.value = 30;
    } else {
        box.classList.remove("active");
        note.classList.remove("active");
        input.value = 0;
    }
}


function togglePodcast() {
    const checked = document.getElementById("podcast").checked;
    const box = document.getElementById("podcastBox");
    const note = document.getElementById("podcastNote");
    const select = document.getElementById("podcastCount");

    if (checked) {
        box.classList.add("active");
        note.classList.add("active");
        if (!select.value) select.value = "1";
    } else {
        box.classList.remove("active");
        note.classList.remove("active");
        select.value = "1";
    }
}


loadCheckboxState();
loadLastInput();
updateDaysHighlight();
loadHistoryList();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(reg => {

      // Có SW mới chờ update
      if (reg.waiting) {
        showUpdateBanner(reg);
      }

      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        newWorker.addEventListener("statechange", () => {
          if (newWorker.state === "installed" &&
              navigator.serviceWorker.controller) {
            showUpdateBanner(reg);
          }
        });
      });
    });

  function showUpdateBanner(reg) {
    if (document.getElementById("update-banner")) return;

    const banner = document.createElement("div");
    banner.id = "update-banner";
    banner.innerHTML = `
      <div style="
        position:fixed;
        bottom:15px;
        left:50%;
        transform:translateX(-50%);
        background:#38bdf8;
        color:#000;
        padding:12px 16px;
        border-radius:10px;
        font-weight:bold;
        z-index:9999;
        box-shadow:0 4px 10px rgba(0,0,0,.3);
      ">
        🚀 Có bản cập nhật mới
        <button id="reload-btn"
          style="
            margin-left:10px;
            padding:6px 10px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
          ">
          Cập nhật
        </button>
      </div>
    `;
    document.body.appendChild(banner);

    document.getElementById("reload-btn").onclick = () => {
      reg.waiting.postMessage({ type: "SKIP_WAITING" });
    };
  }

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    window.location.reload();
  });
}
</script>

const version = document
  .querySelector('meta[name="app-version"]')
  .getAttribute("content");

document.getElementById("app-version").innerText =
  `Phiên bản: v${version}`;
</script>

</div>
